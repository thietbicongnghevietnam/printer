<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

    </style>
</head>
<body>
<table>
    <tr>
        <td>
            <div id="rc_time">--:--:--</div>
        </td>
        <td colspan="2">
            <div id="rc_title"></div>
        </td>
        <td rowspan="2">
            <div id="rc_barcode"></div>
        </td>
    </tr>
    <tr>
        <td><strong>
            <div id="rc_plant"></div>
        </strong></td>
        <td>
            <table>
                <tr><div id="rc_date"></div></tr>
                <tr align="right"><div id="rc_urgent"></div></tr>
            </table>
        </td>
        <td><div id="rc_ul_coc"></div></td>
    </tr>
    <tr>
        <td><strong>Material</strong></td>
        <td colspan="3"><strong>
            <div id="rc_material"></div>
        </strong></td>
    </tr>
    <tr>
        <td>Type</td>
        <td>
            <div id="rc_type"></div>
        </td>
        <td colspan="2"> IQC Check/IQC</td>
    </tr>
    <tr>
        <td>Frequency</td>
        <td>
            <div id="rc_frequency"></div>
        </td>
        <td>Sampling</td>
        <td>ROHS</td>
    </tr>
    <tr>
        <td>Sloc</td>
        <td>
            <div id="rc_sloc"></div>
        </td>
        <td rowspan="3">
            <div id="rc_sample"></div>
        </td>
        <td rowspan="3">
            <div id="rc_rohs"></div>
        </td>
    </tr>
    <tr>
        <td>Code date</td>
        <td>
            <div id="rc_code_date"></div>
        </td>
    </tr>
    <tr>
        <td>Quantity</td>
        <td>
            <div id="rc_quantity"></div>
        </td>
    </tr>
    <tr>
        <td>Invoice/DA</td>
        <td>
            <div id="rc_invoice_da"></div>
        </td>
        <td colspan="2">
            <div id="rc_vendor"></div>
        </td>
    </tr>
    <tr>
        <td rowspan="2">IQC</td>
        <td>IQC/PL</td>
        <td colspan="2">ROHS</td>
    </tr>
    <tr>
        <td>
            <div id="rc_pl"></div>
        </td>
        <td colspan="2">
            <div id="rc_rohs_detail"></div>
        </td>
    </tr>
</table>
</body>
</html>
